# Continuous Delivery Pipeline
# 1. Test on every push/PR
# 2. Build Docker image on merge to master
# 3. Deploy to staging on every push to master
# 4. Deploy to production on release tags

name: CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  # ===== Stage 1: Quality Gates ===== #
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Quality gates match ci.yml exactly (closes part of #114):
      # ci.yml only checks src/, and pre-commit runs its own hooks.
      # Previously this job linted src/+tests/ which double-counted
      # intentional test-style drift and made CI red on every PR.
      - name: Run ruff check
        run: ruff check src/

      - name: Check ruff format
        run: ruff format --check src/

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=src/ --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: vars.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ vars.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ===== Stage 2: Docker Build ===== #
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      image-tag: ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single, explicit tag (was: docker/metadata-action multi-tag output,
      # which trivy-action could not parse). The image is built locally
      # (push: false) and scanned by this same tag; deploy jobs use their
      # own metadata actions and are unaffected.
      - name: Build image (local, single tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # Scan the locally built image with plain trivy (v0.74.0, matching
      # the version previously used by the action). We run trivy directly
      # instead of via trivy-action because the action's image-ref parsing
      # chokes on the comma-joined multi-tag output of
      # docker/metadata-action, and the build step runs with push: false
      # (so nothing is on ghcr.io to pull). The image exists locally on
      # the runner, tagged by the Build step above.
      #
      # Exit: 0 = no CRITICAL/HIGH findings (after .trivyignore); 1 =
      # findings present. Documented base-image exceptions live in
      # .github/trivy-exceptions.md with review dates (2026-11-17).
      # Install + run trivy directly (v0.74.0, matching the previous
      # trivy-action version). trivy-action's image-ref parsing is
      # unreliable with docker/metadata-action's comma-joined multi-tag
      # output, and the build step runs push: false so there is nothing
      # on ghcr.io to pull — we scan the local image by tag instead.
      - name: Install Trivy v0.74.0
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.74.0
          trivy --version

      - name: Run Trivy vulnerability scanner
        run: |
          # Single explicit tag from the Build step (deterministic).
          # --format sarif + --output feeds the upload step below.
          TAG="ghcr.io/${{ github.repository }}:ci-${{ github.sha }}"
          echo "Scanning local image: ${TAG}"
          trivy image "${TAG}" \
            --severity CRITICAL,HIGH \
            --ignorefile .trivyignore \
            --format sarif \
            --output trivy-results.sarif \
            --timeout 10m
          # trivy exits 0 when no (un-ignored) CRITICAL/HIGH findings.

      # codeql-action needs the security-events:write scope which the
      # repo's GITHUB_TOKEN lacks ("Resource not accessible by integration").
      # Upload the SARIF as a regular artifact instead: the vulnerability
      # findings remain available (Actions run page -> Artifacts) and the
      # scan gate (trivy exit code) is unaffected.
      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14

  # ===== Stage 2b: arm64 build check (bonus, #156) ===== #
  # Proves the per-arch pinned base (Dockerfile comment block) builds for
  # linux/arm64 WITHOUT publishing (push: false) and WITHOUT QEMU
  # emulation (arm64 runners run natively). The amd64 path above is
  # unchanged. If the generated arm64 digest drifts from the pinned one,
  # scripts/gen_dockerfile_arm64.py fails the job (digest-sync guard).
  arm64-build:
    name: Docker Build arm64 (no push)
    runs-on: ubuntu-24.04-arm
    needs: [lint, type-check, test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Generate arm64 Dockerfile variant
        run: |
          python3 scripts/gen_dockerfile_arm64.py Dockerfile > Dockerfile.arm64
          grep "^FROM" Dockerfile.arm64

      - name: Build arm64 image (buildx, push=false)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.arm64
          platforms: linux/arm64
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:arm64-ci-${{ github.sha }}
          # NOTE: no gha cache here — the arm64 runner's default "docker"
          # driver (used with load: true) does not support "Cache export is
          # not supported for the docker driver". Build stays uncached
          # (correctness proof, not a build-speed path).
          provenance: false
          sbom: false

      - name: Verify built image architecture
        run: |
          TAG="ghcr.io/${{ github.repository }}:arm64-ci-${{ github.sha }}"
          docker image inspect --format 'Arch: {{.Architecture}} / {{.Os}}' "${TAG}"
          [ "$(docker image inspect --format '{{.Architecture}}' "${TAG}")" = "arm64" ]

  # ===== Stage 3: Deploy to Staging (Master Push) ===== #
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref_name == 'master'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=staging-

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging server
        if: vars.STAGING_SERVER_HOST != ''
        env:
          STAGING_HOST: ${{ vars.STAGING_SERVER_HOST }}
          STAGING_USER: ${{ vars.STAGING_SERVER_USER }}
        run: |
          echo "Deploying to staging: $STAGING_HOST"
          echo "${{ secrets.STAGING_SSH_KEY }}" > deploy_key
          chmod 600 deploy_key

          ssh -o StrictHostKeyChecking=no \
              -i deploy_key \
              $STAGING_USER@$STAGING_HOST \
              'cd /opt/riks-context-engine && \
               git pull origin master && \
               docker pull ghcr.io/${{ github.repository }}:staging-${{ github.sha }} && \
               docker-compose up -d app && \
               docker image prune -f'

          rm deploy_key

      - name: Health check staging
        if: vars.STAGING_API_URL != ''
        run: |
          sleep 5
          curl -f "${{ vars.STAGING_API_URL }}/health" || exit 1

      - name: Run integration tests against staging
        if: vars.STAGING_API_URL != ''
        run: |
          pip install -e ".[dev]"
          pytest tests/test_api.py -v --base-url="${{ vars.STAGING_API_URL }}"

  # ===== Stage 4: Deploy to Production (Release) ===== #
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'release'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,enable=true,value=latest

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > deploy_key
          chmod 600 deploy_key

          ssh -o StrictHostKeyChecking=no \
              -i deploy_key \
              $SERVER_USER@$SERVER_HOST \
              'cd /opt/riks-context-engine && \
               git pull origin master && \
               docker-compose pull && \
               docker-compose up -d && \
               docker image prune -f'

          rm deploy_key

      - name: Production health check
        run: |
          sleep 10
          curl -f "https://${{ secrets.PRODUCTION_DOMAIN }}/health" || exit 1

  # ===== Stage 5: Notify on Completion ===== #
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, docker-build]
    if: always()
    steps:
      - name: Build status summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
