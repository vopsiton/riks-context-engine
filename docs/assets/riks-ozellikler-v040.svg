<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Fonts & Styling -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .title { font-weight: 800; font-size: 32px; fill: #1e293b; letter-spacing: -0.025em; }
      .subtitle { font-weight: 500; font-size: 16px; fill: #64748b; }
      .card-title { font-weight: 700; font-size: 20px; fill: #0f172a; }
      .card-text { font-weight: 400; font-size: 14px; fill: #475569; line-height: 1.6; }
      .card-tag { font-weight: 600; font-size: 11px; fill: #0284c7; letter-spacing: 0.05em; }
      .flow-text { font-weight: 700; font-size: 14px; fill: #334155; }
      .flow-label { font-weight: 800; font-size: 11px; fill: #64748b; letter-spacing: 0.1em; }
      .card { transition: transform 0.3s ease; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Card 1 Gradient (Blue/Teal) -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    
    <!-- Card 2 Gradient (Emerald/Mint) -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>

    <!-- Card 3 Gradient (Indigo/Violet) -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Flow Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="33%" stop-color="#34d399" />
      <stop offset="66%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.02" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative grid -->
  <g opacity="0.2">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="10 10"/>
    <path d="M 200,0 L 200,600 M 400,0 L 400,600 M 600,0 L 600,600 M 800,0 L 800,600 M 1000,0 L 1000,600" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="10 10"/>
  </g>

  <!-- Header -->
  <g transform="translate(80, 80)">
    <!-- Logo Icon representation -->
    <rect width="48" height="48" rx="14" fill="#0f172a" />
    <path d="M16 24C16 19.58 19.58 16 24 16C28.42 16 32 19.58 32 24C32 28.42 28.42 32 24 32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="24" r="3" fill="#38bdf8" />
    
    <text x="68" y="24" class="title">Rik Context Engine</text>
    <text x="68" y="44" class="subtitle">Yeni Nesil Context Yönetim Mimarisi ve Yetenekleri</text>
  </g>

  <!-- ==================== KART 1: ORTAK HAFIZA ==================== -->
  <g class="card" transform="translate(80, 160)" filter="url(#shadow)">
    <!-- Card Base -->
    <rect width="320" height="280" rx="24" fill="url(#card1Grad)" stroke="#bae6fd" stroke-width="1.5"/>
    
    <!-- Icon Container -->
    <rect x="24" y="28" width="48" height="48" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Brain & Isolation Icon -->
    <g transform="translate(34, 38)">
      <path d="M9 22a5 5 0 0 1-5-5 5 5 0 0 1 .5-2.25A5 5 0 0 1 3 10a5 5 0 0 1 5-5h1a4 4 0 0 1 7.75-1.5A5 5 0 0 1 21 8a5 5 0 0 1-1 3.25 5 5 0 0 1-1 7.75" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M12 8v8M8 12h8" stroke="#0284c7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Tag -->
    <text x="88" y="56" class="card-tag" fill="#0284c7">PAYLAŞIMLI AKIL</text>

    <!-- Content -->
    <text x="24" y="112" class="card-title">Ortak Hafıza</text>
    
    <!-- Paragraph lines -->
    <text x="24" y="148" class="card-text">Ekip genelinde context paylaşımını</text>
    <text x="24" y="170" class="card-text">mümkün kılarken, güçlü tenant</text>
    <text x="24" y="192" class="card-text">izolasyonu ile verilerinizi güvenle</text>
    <text x="24" y="214" class="card-text">ayırır ve gizliliği korur.</text>

    <!-- Sub-feature indicators -->
    <g transform="translate(24, 240)" opacity="0.8">
      <circle cx="6" cy="-4" r="3" fill="#0284c7" />
      <text x="16" y="0" font-size="12" font-weight="600" fill="#0369a1">Güvenli Tenant İzolasyonu</text>
    </g>
  </g>

  <!-- ==================== KART 2: YEDEKLEME & SAĞLIK ==================== -->
  <g class="card" transform="translate(440, 160)" filter="url(#shadow)">
    <!-- Card Base -->
    <rect width="320" height="280" rx="24" fill="url(#card2Grad)" stroke="#bbf7d0" stroke-width="1.5"/>
    
    <!-- Icon Container -->
    <rect x="24" y="28" width="48" height="48" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
    <!-- Backup & Heart Icon -->
    <g transform="translate(45, 39)">
      <path d="M12 2v8M12 2L8 6M12 2l4 4" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M2 10h20v6a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4v-6z" stroke="#15803d" stroke-width="2" fill="none" transform="translate(0,2)"/>
      <path d="M6 16h4M14 16h4" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Tag -->
    <text x="88" y="56" class="card-tag" fill="#16803d">SİSTEM SAĞLIĞI</text>

    <!-- Content -->
    <text x="24" y="112" class="card-title">Yedekleme &amp; Sağlık</text>
    
    <!-- Paragraph lines -->
    <text x="24" y="148" class="card-text">Context geçmişinizi otomatik olarak</text>
    <text x="24" y="170" class="card-text">yedekler. Sürekli sağlık kontrolü</text>
    <text x="24" y="192" class="card-text">(health check) ile kesintisiz ve</text>
    <text x="24" y="214" class="card-text">hatasız bir çalışma ortamı sunar.</text>

    <!-- Sub-feature indicators -->
    <g transform="translate(24, 240)" opacity="0.8">
      <circle cx="6" cy="-4" r="3" fill="#16803d" />
      <text x="16" y="0" font-size="12" font-weight="600" fill="#14532d">Otomatik Kurtarma Noktaları</text>
    </g>
  </g>

  <!-- ==================== KART 3: MCP v2 GÖREV ÇALIŞTIRMA ==================== -->
  <g class="card" transform="translate(800, 160)" filter="url(#shadow)">
    <!-- Card Base -->
    <rect width="320" height="280" rx="24" fill="url(#card3Grad)" stroke="#c7d2fe" stroke-width="1.5"/>
    
    <!-- Icon Container -->
    <rect x="24" y="28" width="48" height="48" rx="12" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5" />
    <!-- Lightning & Terminal Icon -->
    <g transform="translate(44, 38)">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Tag -->
    <text x="88" y="56" class="card-tag" fill="#4f46e5">OTOMASYON</text>

    <!-- Content -->
    <text x="24" y="112" class="card-title">MCP v2 Çalıştırıcı</text>
    
    <!-- Paragraph lines -->
    <text x="24" y="148" class="card-text">Model Context Protocol v2 ile</text>
    <text x="24" y="170" class="card-text">entegre görevleri doğrudan sistem</text>
    <text x="24" y="192" class="card-text">üzerinde güvenli sandbox'larda</text>
    <text x="24" y="214" class="card-text">hızla tetikler ve yürütür.</text>

    <!-- Sub-feature indicators -->
    <g transform="translate(24, 240)" opacity="0.8">
      <circle cx="6" cy="-4" r="3" fill="#4f46e5" />
      <text x="16" y="0" font-size="12" font-weight="600" fill="#1e1b4b">Sandbox Görev Yürütme</text>
    </g>
  </g>

  <!-- ==================== FLOW LOOP SECTION ==================== -->
  <g transform="translate(80, 480)">
    <!-- Flow Title -->
    <text x="0" y="32" class="flow-label">SÜREKLİ GELİŞİM DÖNGÜSÜ</text>

    <!-- Flow Background Line -->
    <path d="M 220,24 L 980,24" stroke="url(#flowGrad)" stroke-width="6" stroke-linecap="round" opacity="0.15"/>
    <path d="M 220,24 L 980,24" stroke="url(#flowGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 8"/>

    <!-- Loop Items -->
    <!-- 1. Hatırla -->
    <g transform="translate(220, 24)">
      <circle cx="0" cy="0" r="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#0284c7" />
      <text x="0" y="34" text-anchor="middle" class="flow-text">Hatırla</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 370,24 L 380,24" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- 2. Koru -->
    <g transform="translate(460, 24)">
      <circle cx="0" cy="0" r="18" fill="#dcfce7" stroke="#16803d" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#16803d" />
      <text x="0" y="34" text-anchor="middle" class="flow-text">Koru</text>
    </g>

    <!-- 3. Çalıştır -->
    <g transform="translate(700, 24)">
      <circle cx="0" cy="0" r="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#4f46e5" />
      <text x="0" y="34" text-anchor="middle" class="flow-text">Çalıştır</text>
    </g>

    <!-- 4. Öğren -->
    <g transform="translate(940, 24)">
      <circle cx="0" cy="0" r="18" fill="#fce7f3" stroke="#db2777" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#db2777" />
      <text x="0" y="34" text-anchor="middle" class="flow-text">Öğren</text>
    </g>
  </g>
</svg>
